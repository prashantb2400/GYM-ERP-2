version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gymerp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymerp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymerp"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    image: postgres:16-alpine
    container_name: gymerp-db-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./deploy/init-db.sh:/init-db.sh:ro
      - ./supabase/migrations:/migrations:ro
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gymerp
      POSTGRES_USER: postgres
      POSTGRES_DB: gymerp
    entrypoint: ["/bin/sh", "-c", "bash /init-db.sh"]

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: gymerp-postgrest
    restart: unless-stopped
    ports:
      - "54321:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/gymerp
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: gymerp-offline-local-jwt-secret-minimum-32-chars-long
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: gymerp-whatsapp
    restart: unless-stopped
    ports:
      - "48291:48291"
    volumes:
      - whatsapp_data:/app/data
    environment:
      PORT: 48291
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:48291/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymerp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_POSTGREST_URL: http://postgrest:3000
      INTERNAL_SUPABASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:48291
      PGRST_JWT_SECRET: gymerp-offline-local-jwt-secret-minimum-32-chars-long
      AUTO_SEED_DEMO_GYM: ${AUTO_SEED_DEMO_GYM:-false}
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      postgrest:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: gymerp-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    profiles:
      - proxy
      - full

volumes:
  pgdata:
    driver: local
  whatsapp_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
