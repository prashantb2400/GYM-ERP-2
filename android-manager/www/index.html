<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GymERP Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #09090b;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      background: #3b82f6;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
    }
    .logo-badge svg {
      width: 34px;
      height: 34px;
      fill: #ffffff;
      transform: rotate(45deg);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(to right, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 14px;
      color: #a1a1aa;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-msg {
      font-size: 13px;
      color: #d4d4d8;
      margin-bottom: 16px;
      min-height: 20px;
    }
    .error-banner {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: #f87171;
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.4;
      display: none;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #d4d4d8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus, input[type="text"]:focus {
      border-color: #60a5fa;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #1d4ed8;
    }
    .btn-secondary {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn-secondary:active {
      background: #27272a;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 20px;
    }
    .preset-chip {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #d4d4d8;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .preset-chip:active {
      background: #3f3f46;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="container" id="appCard">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>
    </div>
    <h1 id="titleText">GymERP Manager</h1>
    <p class="subtitle" id="subtitleText">Gym Owner & Staff Operations</p>

    <!-- Error Banner -->
    <div id="errorBanner" class="error-banner"></div>

    <!-- Loading View -->
    <div id="loadingView">
      <div class="spinner"></div>
      <div id="statusMsg" class="status-msg">Connecting to GymERP...</div>
      <button class="btn-secondary" id="btnCancel" onclick="showConfigScreen()">Change Server URL</button>
    </div>

    <!-- Config View -->
    <div id="configView" style="display: none;">
      <div class="form-group">
        <label for="serverInput">Gym Server Address</label>
        <input
          type="url"
          id="serverInput"
          placeholder="https://your-gym.vercel.app"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        >
        <div class="presets">
          <button type="button" class="preset-chip" onclick="setPreset('http://10.0.2.2:3000')">Emulator Localhost</button>
          <button type="button" class="preset-chip" onclick="setPreset('http://192.168.1.')">LAN IP</button>
          <button type="button" class="preset-chip" onclick="setPreset('https://')">Cloud HTTPS</button>
        </div>
      </div>

      <button class="btn-primary" id="btnConnect" onclick="handleConnect()">Connect & Launch Dashboard</button>
      <div class="footer-note">Triple-tap the screen at any time to reconfigure the server address.</div>
    </div>
  </div>

  <script>
    const MANAGER_TARGET_PATH = '/dashboard';
    const STORAGE_KEY = 'gymerp_server_url';

    function getSavedUrl() {
      try {
        return localStorage.getItem(STORAGE_KEY) || '';
      } catch (e) {
        return '';
      }
    }

    function saveUrl(url) {
      try {
        localStorage.setItem(STORAGE_KEY, url);
      } catch (e) {}
    }

    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      banner.textContent = msg;
      banner.style.display = 'block';
    }

    function hideError() {
      const banner = document.getElementById('errorBanner');
      banner.style.display = 'none';
      banner.textContent = '';
    }

    function setStatus(msg) {
      document.getElementById('statusMsg').textContent = msg;
    }

    function showConfigScreen(initialValue) {
      hideError();
      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('configView').style.display = 'block';
      const input = document.getElementById('serverInput');
      input.value = initialValue || getSavedUrl() || '';
      input.focus();
    }

    function showLoadingScreen() {
      hideError();
      document.getElementById('configView').style.display = 'none';
      document.getElementById('loadingView').style.display = 'block';
    }

    function setPreset(val) {
      const input = document.getElementById('serverInput');
      input.value = val;
      input.focus();
    }

    function cleanUrl(raw) {
      let url = (raw || '').trim();
      if (!url) return '';
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      return url.replace(/\/+$/, '');
    }

    async function probeServer(baseUrl) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4000);

      try {
        // Try /api/health first
        const res = await fetch(baseUrl + '/api/health', {
          method: 'GET',
          signal: controller.signal,
          mode: 'cors'
        });
        clearTimeout(timer);
        return res.status < 500;
      } catch (err) {
        clearTimeout(timer);
        // Fallback: try root request with no-cors
        try {
          const fbController = new AbortController();
          const fbTimer = setTimeout(() => fbController.abort(), 3500);
          await fetch(baseUrl + '/', {
            method: 'HEAD',
            mode: 'no-cors',
            signal: fbController.signal
          });
          clearTimeout(fbTimer);
          return true;
        } catch (e) {
          return false;
        }
      }
    }

    async function attemptLaunch(targetBaseUrl) {
      showLoadingScreen();
      setStatus('Checking connection to ' + targetBaseUrl + '...');

      const reachable = await probeServer(targetBaseUrl);
      if (reachable) {
        setStatus('Connected! Launching Dashboard...');
        saveUrl(targetBaseUrl);
        setTimeout(() => {
          window.location.replace(targetBaseUrl + MANAGER_TARGET_PATH);
        }, 300);
      } else {
        showConfigScreen(targetBaseUrl);
        showError('Unable to reach ' + targetBaseUrl + '. Verify server is running and Wi-Fi is connected.');
      }
    }

    async function handleConnect() {
      hideError();
      const rawInput = document.getElementById('serverInput').value;
      const url = cleanUrl(rawInput);

      if (!url) {
        showError('Please enter your GymERP server address.');
        return;
      }

      const btn = document.getElementById('btnConnect');
      btn.disabled = true;
      btn.textContent = 'Testing Connection...';

      const ok = await probeServer(url);
      btn.disabled = false;
      btn.textContent = 'Connect & Launch Dashboard';

      if (ok) {
        saveUrl(url);
        showLoadingScreen();
        setStatus('Connection verified! Loading Dashboard...');
        setTimeout(() => {
          window.location.replace(url + MANAGER_TARGET_PATH);
        }, 300);
      } else {
        showError('Could not connect to ' + url + '. Check the address and try again.');
      }
    }

    // Secret gesture: triple-tap anywhere to reset server config
    let tapCount = 0;
    let tapTimer = null;
    document.addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 600);
      if (tapCount >= 3) {
        tapCount = 0;
        showConfigScreen();
      }
    });

    // Auto-boot sequence on app launch
    window.addEventListener('DOMContentLoaded', () => {
      const saved = getSavedUrl();
      if (saved) {
        attemptLaunch(cleanUrl(saved));
      } else {
        showConfigScreen();
      }
    });
  </script>
</body>
</html>
