<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymERP Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    body {
      background-color: #09090b;
      color: #fafafa;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .badge {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #9333ea);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }
    .badge svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #27272a;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 13px;
      color: #d4d4d8;
      font-family: ui-monospace, monospace;
      margin-bottom: 20px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #d4d4d8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #3f3f46;
      background: #09090b;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .chip {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-family: ui-monospace, monospace;
    }
    .chip:hover {
      background: #3f3f46;
      color: #ffffff;
    }
    button.btn-primary {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #6366f1;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }
    button.btn-primary:hover {
      background: #4f46e5;
    }
    button.btn-secondary {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 12px;
    }
    button.btn-secondary:hover {
      color: #ffffff;
      border-color: #71717a;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43 1.43 1.43 2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43 1.43-1.43z"/></svg>
    </div>
    <h1>GymERP Reception Desktop</h1>
    <p class="subtitle">Autonomous AI Gym Management Terminal</p>

    <div id="errorBox" class="error-box"></div>

    <div id="loadingView">
      <div class="spinner"></div>
      <div id="statusMsg" class="status">Connecting to Gym Server...</div>
      <button type="button" class="btn-secondary" onclick="showConfig()">Configure Server URL</button>
    </div>

    <div id="configView" style="display: none;">
      <div class="form-group">
        <label for="serverUrl">Gym Server Address</label>
        <input type="text" id="serverUrl" placeholder="http://127.0.0.1:3000 or https://gymerp.app">
        <div class="chips">
          <span class="chip" onclick="setPreset('http://127.0.0.1:3000')">Local Appliance (127.0.0.1:3000)</span>
          <span class="chip" onclick="setPreset('http://gymerp.local:3000')">Local Network (gymerp.local)</span>
          <span class="chip" onclick="setPreset('http://192.168.1.')">LAN IP</span>
        </div>
      </div>
      <button type="button" class="btn-primary" id="btnConnect" onclick="handleConnect()">Connect to Gym</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'gymerp_desktop_server_url';
    const DEFAULT_LOCAL = 'http://127.0.0.1:3000';

    function getSavedUrl() {
      try {
        return localStorage.getItem(STORAGE_KEY) || '';
      } catch (e) {
        return '';
      }
    }

    function saveUrl(url) {
      try {
        localStorage.setItem(STORAGE_KEY, url);
      } catch (e) {}
    }

    function setPreset(url) {
      const input = document.getElementById('serverUrl');
      input.value = url;
      input.focus();
    }

    function showConfig() {
      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('configView').style.display = 'block';
      const input = document.getElementById('serverUrl');
      input.value = getSavedUrl() || DEFAULT_LOCAL;
      input.focus();
    }

    function showLoading(msg) {
      document.getElementById('configView').style.display = 'none';
      document.getElementById('loadingView').style.display = 'block';
      document.getElementById('statusMsg').textContent = msg || 'Connecting...';
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      const box = document.getElementById('errorBox');
      box.style.display = 'none';
    }

    async function probeServer(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      try {
        const res = await fetch(url + '/api/health', {
          method: 'GET',
          signal: controller.signal,
          mode: 'cors'
        });
        clearTimeout(timeout);
        return res.status < 500;
      } catch {
        clearTimeout(timeout);
        // Fallback test root
        try {
          const c2 = new AbortController();
          const t2 = setTimeout(() => c2.abort(), 2000);
          await fetch(url + '/', { method: 'HEAD', mode: 'no-cors', signal: c2.signal });
          clearTimeout(t2);
          return true;
        } catch {
          return false;
        }
      }
    }

    async function launch(targetUrl) {
      showLoading('Checking connection to ' + targetUrl + '...');
      const ok = await probeServer(targetUrl);
      if (ok) {
        saveUrl(targetUrl);
        showLoading('Loading Dashboard...');
        setTimeout(() => {
          window.location.replace(targetUrl + '/dashboard');
        }, 200);
      } else {
        showConfig();
        showError('Could not connect to server at ' + targetUrl + '. Ensure GymERP is running.');
      }
    }

    async function handleConnect() {
      hideError();
      let raw = document.getElementById('serverUrl').value.trim();
      if (!raw) {
        showError('Please enter a server address.');
        return;
      }
      if (!raw.startsWith('http://') && !raw.startsWith('https://')) {
        raw = 'http://' + raw;
      }
      raw = raw.replace(/\/+$/, '');

      const btn = document.getElementById('btnConnect');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      const ok = await probeServer(raw);
      btn.disabled = false;
      btn.textContent = 'Connect to Gym';

      if (ok) {
        saveUrl(raw);
        showLoading('Launching GymERP Dashboard...');
        setTimeout(() => {
          window.location.replace(raw + '/dashboard');
        }, 200);
      } else {
        showError('Connection failed to ' + raw + '. Check URL or start local server.');
      }
    }

    // Auto-boot
    window.addEventListener('DOMContentLoaded', async () => {
      const saved = getSavedUrl();
      if (saved) {
        await launch(saved);
      } else {
        // Try local appliance first
        showLoading('Probing local GymERP server...');
        const localOk = await probeServer(DEFAULT_LOCAL);
        if (localOk) {
          saveUrl(DEFAULT_LOCAL);
          window.location.replace(DEFAULT_LOCAL + '/dashboard');
        } else {
          showConfig();
        }
      }
    });

    // Reset shortcut: Ctrl + Shift + R
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === 'R') {
        localStorage.removeItem(STORAGE_KEY);
        showConfig();
      }
    });
  </script>
</body>
</html>
