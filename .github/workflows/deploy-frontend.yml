name: Deploy Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    environment: production
    # Skip this job if SUPABASE_PROJECT_REF secret is not set
    if: ${{ vars.SKIP_MIGRATION != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: migrate
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

# Required GitHub Secrets (Settings → Secrets and variables → Actions):
# ── Supabase (optional – for auto-migrations) ──────────────────────────────
# SUPABASE_ACCESS_TOKEN  – from supabase.com/dashboard/account/tokens
# SUPABASE_PROJECT_REF   – your project reference ID (e.g. abcdefghijklmnop)
# SUPABASE_DB_PASSWORD   – database password set during project creation
#
# ── App environment ────────────────────────────────────────────────────────
# NEXT_PUBLIC_SUPABASE_URL      – your supabase project URL
# NEXT_PUBLIC_SUPABASE_ANON_KEY – supabase anon/public key
# SUPABASE_SERVICE_ROLE_KEY     – supabase service role key (keep secret!)
# NEXT_PUBLIC_APP_URL           – your vercel domain, e.g. https://gymerp.vercel.app
#
# ── Vercel ─────────────────────────────────────────────────────────────────
# VERCEL_TOKEN      – from vercel.com/account/tokens
# VERCEL_ORG_ID     – from vercel project settings
# VERCEL_PROJECT_ID – from vercel project settings
#
# ── Variables (Settings → Secrets and variables → Variables) ───────────────
# SKIP_MIGRATION=true   – set this if you want to skip the migration step

