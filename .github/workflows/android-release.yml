name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        working-directory: ./android-kiosk
        run: npm install

      - name: Sync Capacitor
        working-directory: ./android-kiosk
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: ./android-kiosk/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./android-kiosk/android
        run: ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: ./android-kiosk/android
        run: ./gradlew assembleRelease

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymerp-kiosk-apks
          path: |
            android-kiosk/android/app/build/outputs/apk/debug/*.apk
            android-kiosk/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-kiosk/android/app/build/outputs/apk/debug/*.apk
            android-kiosk/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
