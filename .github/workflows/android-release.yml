name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # 1. Build GymERP Kiosk APK (Tablet Front Desk Kiosk)
      - name: Install dependencies for Kiosk
        working-directory: ./android-kiosk
        run: npm install

      - name: Sync Capacitor for Kiosk
        working-directory: ./android-kiosk
        run: npx cap sync android

      - name: Make Kiosk Gradle wrapper executable
        working-directory: ./android-kiosk/android
        run: chmod +x ./gradlew

      - name: Build Kiosk APKs (Debug and Release)
        working-directory: ./android-kiosk/android
        run: ./gradlew assembleDebug assembleRelease

      # 2. Build GymERP Manager APK (Owner & Staff Dashboard)
      - name: Install dependencies for Manager
        working-directory: ./android-manager
        run: npm install

      - name: Sync Capacitor for Manager
        working-directory: ./android-manager
        run: npx cap sync android

      - name: Make Manager Gradle wrapper executable
        working-directory: ./android-manager/android
        run: chmod +x ./gradlew

      - name: Build Manager APKs (Debug and Release)
        working-directory: ./android-manager/android
        run: ./gradlew assembleDebug assembleRelease

      # 3. Collect and Rename All APKs
      - name: Stage Release APKs
        run: |
          mkdir -p release-apks
          cp android-kiosk/android/app/build/outputs/apk/debug/app-debug.apk release-apks/gymerp-kiosk-debug.apk
          cp android-kiosk/android/app/build/outputs/apk/release/*.apk release-apks/gymerp-kiosk-release.apk
          cp android-manager/android/app/build/outputs/apk/debug/app-debug.apk release-apks/gymerp-manager-debug.apk
          cp android-manager/android/app/build/outputs/apk/release/*.apk release-apks/gymerp-manager-release.apk
          ls -lh release-apks/

      # 4. Upload GitHub Actions Artifacts
      - name: Upload Kiosk APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymerp-kiosk-apks
          path: release-apks/gymerp-kiosk-*.apk
          if-no-files-found: warn

      - name: Upload Manager APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymerp-manager-apks
          path: release-apks/gymerp-manager-*.apk
          if-no-files-found: warn

      # 5. Attach All APKs to GitHub Release
      - name: Attach All APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
