name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.4)'
        required: true
        default: 'v1.0.4'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # 1. Build GymERP Kiosk APK (Tablet Front Desk Kiosk)
      - name: Install dependencies for Kiosk
        working-directory: ./android-kiosk
        run: npm install

      - name: Sync Capacitor for Kiosk
        working-directory: ./android-kiosk
        run: npx cap sync android

      - name: Make Kiosk Gradle wrapper executable
        working-directory: ./android-kiosk/android
        run: chmod +x ./gradlew

      - name: Build Kiosk APKs (Debug and Release)
        working-directory: ./android-kiosk/android
        run: ./gradlew assembleDebug assembleRelease

      # 2. Build GymERP Manager APK (Owner & Staff Dashboard)
      - name: Install dependencies for Manager
        working-directory: ./android-manager
        run: npm install

      - name: Sync Capacitor for Manager
        working-directory: ./android-manager
        run: npx cap sync android

      - name: Make Manager Gradle wrapper executable
        working-directory: ./android-manager/android
        run: chmod +x ./gradlew

      - name: Build Manager APKs (Debug and Release)
        working-directory: ./android-manager/android
        run: ./gradlew assembleDebug assembleRelease

      # 3. Collect, Sign Fallback, and Stage All APKs
      - name: Stage Release APKs
        run: |
          mkdir -p release-apks
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          # 3a. Stage Kiosk Debug APK
          if [ -f android-kiosk/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android-kiosk/android/app/build/outputs/apk/debug/app-debug.apk release-apks/gymerp-kiosk-debug.apk
          fi

          # 3b. Stage Kiosk Release APK (signed)
          if [ -f android-kiosk/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android-kiosk/android/app/build/outputs/apk/release/app-release.apk release-apks/gymerp-kiosk-release.apk
          elif [ -f android-kiosk/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks "$DEBUG_KEYSTORE" --ks-pass pass:android --out release-apks/gymerp-kiosk-release.apk android-kiosk/android/app/build/outputs/apk/release/app-release-unsigned.apk
          else
            cp android-kiosk/android/app/build/outputs/apk/release/*.apk release-apks/gymerp-kiosk-release.apk || true
          fi

          # 3c. Stage Manager Debug APK
          if [ -f android-manager/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android-manager/android/app/build/outputs/apk/debug/app-debug.apk release-apks/gymerp-manager-debug.apk
          fi

          # 3d. Stage Manager Release APK (signed)
          if [ -f android-manager/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android-manager/android/app/build/outputs/apk/release/app-release.apk release-apks/gymerp-manager-release.apk
          elif [ -f android-manager/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks "$DEBUG_KEYSTORE" --ks-pass pass:android --out release-apks/gymerp-manager-release.apk android-manager/android/app/build/outputs/apk/release/app-release-unsigned.apk
          else
            cp android-manager/android/app/build/outputs/apk/release/*.apk release-apks/gymerp-manager-release.apk || true
          fi

          # Verify all files
          echo "Staged APK artifacts:"
          ls -lh release-apks/

      # 4. Upload GitHub Actions Artifacts
      - name: Upload Kiosk APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymerp-kiosk-apks
          path: release-apks/gymerp-kiosk-*.apk
          if-no-files-found: warn

      - name: Upload Manager APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymerp-manager-apks
          path: release-apks/gymerp-manager-*.apk
          if-no-files-found: warn

      # 5. Attach All APKs to GitHub Release
      - name: Attach All APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
