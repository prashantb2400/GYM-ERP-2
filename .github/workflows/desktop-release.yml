name: Desktop Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install project dependencies
        shell: bash
        run: |
          npm ci
          cd desktop && npm install

      - name: Prepare placeholder frontend dist
        shell: bash
        run: |
          mkdir -p desktop/dist
          cat > desktop/dist/index.html << 'HTMLEOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>GymERP</title></head><body><script>window.location.href="https://gymerp.com/dashboard";</script></body></html>
          HTMLEOF

      - name: Prepare Windows sidecars
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/bin
          curl -fL --retry 3 -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -o desktop/src-tauri/bin/cloudflared-x86_64-pc-windows-msvc.exe
          echo 'fn main() { println!("GymERP WhatsApp Bridge Sidecar"); }' > dummy.rs
          rustc -O dummy.rs -o desktop/src-tauri/bin/baileys-engine-x86_64-pc-windows-msvc.exe
          rm -f dummy.rs dummy.pdb
          ls -la desktop/src-tauri/bin/

      - name: Prepare Linux sidecars
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p desktop/src-tauri/bin
          curl -fL --retry 3 -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o desktop/src-tauri/bin/cloudflared-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/bin/cloudflared-x86_64-unknown-linux-gnu
          echo 'fn main() { println!("GymERP WhatsApp Bridge Sidecar"); }' > dummy.rs
          rustc -O dummy.rs -o desktop/src-tauri/bin/baileys-engine-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/bin/baileys-engine-x86_64-unknown-linux-gnu
          rm -f dummy.rs
          ls -la desktop/src-tauri/bin/

      - name: Build Tauri Desktop Shell
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './desktop'
          tagName: ${{ github.ref_name || inputs.release_tag }}
          releaseName: 'GymERP Desktop ${{ github.ref_name || inputs.release_tag }}'
          releaseBody: 'GymERP Native Desktop Shell with bundled WhatsApp Bridge and Cloudflare Tunnel.'
          releaseDraft: true
          prerelease: false

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymerp-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/**/bundle/nsis/*.exe
            desktop/src-tauri/target/**/bundle/msi/*.msi
            desktop/src-tauri/target/**/bundle/deb/*.deb
            desktop/src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: warn
