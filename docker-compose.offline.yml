version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gymerp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymerp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymerp"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: gymerp-postgrest
    restart: unless-stopped
    ports:
      - "54321:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/gymerp
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: gymerp-offline-local-jwt-secret-minimum-32-chars-long
    depends_on:
      db:
        condition: service_healthy

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: gymerp-whatsapp
    restart: unless-stopped
    ports:
      - "48291:48291"
    volumes:
      - whatsapp_data:/app/data
    environment:
      PORT: 48291
      NODE_ENV: production

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymerp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:48291
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started

volumes:
  pgdata:
    driver: local
  whatsapp_data:
    driver: local
